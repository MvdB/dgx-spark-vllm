# vLLM Profil – nvidia--NVIDIA-Nemotron-Labs-3-Puzzle-75B-A9B-NVFP4
# Manuell anpassen wenn nötig. Wird von vllm_spark.sh geladen.
#
# STATUS: NOCH NICHT VALIDIERT (Stand 2026-07-08, Weights-Sync lief noch).
# Settings gespiegelt von NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4 (validiert
# auf v0.18.0): MARLIN-NVFP4-Backend + TRITON_ATTN nötig auf sm_120/GB10,
# FLASHINFER_CUTLASS crasht dort.
#
# Architektur: NemotronHPuzzleForCausalLM (nemotron_h_puzzle) — heterogene
# Puzzle-NAS-Variante des Nemotron-H-Hybrids (Mamba + Attention, MoE A9B).
# auto_map in config.json → trust_remote_code zwingend.
# Falls v0.24.0 die Architektur nicht kennt: Startup-Log prüfen
# ("Unrecognized model" → neuere Image-Version oder custom Build nötig).

PROFILE_VLLM_COMPATIBLE=1
PROFILE_GPU_MEM_UTIL='0.90'
# Nativ 262144 — konservativ wie Super-120B begrenzt
PROFILE_MAX_MODEL_LEN=131072
PROFILE_MAX_NUM_SEQS=4
PROFILE_MAX_NUM_BATCHED_TOKENS=16384
PROFILE_KV_CACHE_DTYPE='fp8'
PROFILE_TOOL_CALL_PARSER='qwen3_coder'
PROFILE_ENABLE_AUTO_TOOL_CHOICE=1
PROFILE_REASONING_PARSER='nemotron_v3'
PROFILE_TRUST_REMOTE_CODE=1
PROFILE_ATTENTION_BACKEND='TRITON_ATTN'
PROFILE_DOCKER_IMAGE='vllm/vllm-openai:v0.24.0'
PROFILE_USE_V2_MODEL_RUNNER=0
PROFILE_DOCKER_ENV='VLLM_NVFP4_GEMM_BACKEND=marlin VLLM_USE_FLASHINFER_MOE_FP4=0 VLLM_TEST_FORCE_FP8_MARLIN=1 VLLM_ENGINE_CORE_STARTUP_TIMEOUT=300'
PROFILE_NOTES='UNVALIDIERT — Heads-up-Kandidat vs Super-120B auf v0.24.0. Settings von Super-120B übernommen (MARLIN + TRITON_ATTN, sm_120). trust_remote_code wegen auto_map.'
