# vLLM Profil – nvidia--Nemotron-3-Nano-Omni-30B-A3B-Reasoning-NVFP4
# Manuell anpassen wenn nötig. Wird von vllm_spark.sh geladen.
#
# Omni-Multimodal MoE (Text + Bild + Audio + Video), NVFP4-quantisiert,
# Architektur: NemotronH_Nano_Omni_Reasoning_V3 (NVIDIA custom code).
# Erfordert vLLM v0.20.0 (CUDA 13 / sm_120 nativ) + audio-Extras.
#
# Docker-Image hat keine Audio-Pakete → werden via PROFILE_PRE_SERVE_CMD
# beim Containerstart nachinstalliert (pip install vllm[audio]).

PROFILE_VLLM_COMPATIBLE=1
PROFILE_DOCKER_IMAGE='vllm/vllm-openai:v0.20.0'
PROFILE_GPU_MEM_UTIL='0.8'
PROFILE_MAX_MODEL_LEN=131072
PROFILE_MAX_NUM_SEQS=8
PROFILE_MAX_NUM_BATCHED_TOKENS=32768
PROFILE_TRUST_REMOTE_CODE=1
PROFILE_REASONING_PARSER='nemotron_v3'
PROFILE_TOOL_CALL_PARSER='qwen3_coder'
PROFILE_ENABLE_AUTO_TOOL_CHOICE=1
PROFILE_IPC_HOST=1

# Pre-Serve: vllm[audio] Extras nachziehen (Image enthält keine Audio-Pakete)
PROFILE_BASH_WRAPPER=1
PROFILE_PRE_SERVE_CMD='pip install vllm[audio]'

# Multimodale Limits + Video-IO + lokale Media-Pfade (JSON-Werte → als Bash-Array)
PROFILE_VLLM_EXTRA_ARGS=(
  '--limit-mm-per-prompt'   '{"video": 1, "image": 1, "audio": 1}'
  '--media-io-kwargs'       '{"video": {"fps": 2, "num_frames": 256}}'
  '--allowed-local-media-path=/'
)

PROFILE_USE_V2_MODEL_RUNNER=0  # linear-attention / Mamba-Hybrid → kein MRV2-Pfad
PROFILE_NOTES='Omni-MM (Text+Bild+Audio+Video) NVFP4 MoE. v0.20.0 + pip install vllm[audio] beim Start. Vendor-Settings 1:1 übernommen.'
