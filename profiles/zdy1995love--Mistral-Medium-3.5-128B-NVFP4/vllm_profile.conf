# vLLM Profil – zdy1995love/Mistral-Medium-3.5-128B-NVFP4
#
# Community-NVFP4-Quant des Mistral-Medium-3.5-128B Targets.
# Architektur: Mistral3ForConditionalGeneration (multimodal, mit Pixtral-Vision-Tower).
#   text_config: ministral3, 88 layers, 96 heads, 8 KV, head_dim=128,
#                hidden=12288, intermediate=28672, vocab=131072
#   vision_config: pixtral, 48 layers, hidden=1664, image_size=1540, patch=14
# Quantisierung: compressed-tensors nvfp4-pack-quantized (group_size=16).
#   Vision-Tower + multi_modal_projector + lm_head bleiben BF16 (in 'ignore' list).
# Repo: 10 HF model-*.safetensors (~74 GB unique weights).
#
# Speicherbudget Spark (128 GB unified, 85% util ≈ 108 GB):
#   Gewichte ≈ 74 GB → ~34 GB Headroom für KV + Workspace
#   KV pro Token (FP8): 88 × 8 × 128 × 2 = 176 KB
#   max_model_len=16384, max_num_seqs=2 → KV ≈ 5.6 GB → reichlich Spielraum
#   max_model_len=32768, max_num_seqs=2 → KV ≈ 11 GB → noch ok
#   Native max_position_embeddings=262144 via YARN (factor=64), nicht erreichbar.
#
# Tokenizer: tokenizer.json + tekken.json beide vorhanden. vLLM auto-detect
# schaltet wegen tekken.json auf MistralCommonBackend → Backend hat in v0.20.0
# kein is_fast property → Crash. Daher TOKENIZER_MODE=hf erzwingen
# (wie bei Mistral-Small-3.2-24B-NVFP4).

PROFILE_VLLM_COMPATIBLE=1
PROFILE_DOCKER_IMAGE='vllm/vllm-openai:v0.20.0'
PROFILE_DTYPE='bfloat16'
PROFILE_QUANTIZATION='compressed-tensors'
PROFILE_GPU_MEM_UTIL='0.85'
PROFILE_MAX_MODEL_LEN=16384
PROFILE_MAX_NUM_SEQS=2
PROFILE_MAX_NUM_BATCHED_TOKENS=4096
PROFILE_ENFORCE_EAGER=1
PROFILE_TRUST_REMOTE_CODE=0
PROFILE_KV_CACHE_DTYPE='fp8'
PROFILE_TOKENIZER_MODE='hf'
PROFILE_TOOL_CALL_PARSER='mistral'
PROFILE_ENABLE_AUTO_TOOL_CHOICE=1
PROFILE_NOTES='Mistral3 128B NVFP4 (compressed-tensors). Multimodal (Pixtral-Vision). v0.20.0. ~74 GB weights, max_model_len=16k konservativ (native 262k). TOKENIZER_MODE=hf wegen tekken.json+mistral_common-Konflikt. EAGLE-Draft (mistralai--Mistral-Medium-3.5-128B-EAGLE) kann später via --speculative_config gepaart werden.'
