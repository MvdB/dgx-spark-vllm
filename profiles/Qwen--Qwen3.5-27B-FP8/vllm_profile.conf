# vLLM Profil – Qwen/Qwen3.5-27B-FP8
# FP8 dense. spark-qwen35vl:v1: NVIDIA Spark + conv3d-Patch für GB10 (sm_120).
# Native Qwen3_5ForConditionalGeneration-Arch — kein HF_OVERRIDES nötig.
# Gleicher Fix wie Qwen3.6-35B-A3B-FP8 (dense statt MoE, sonst identisch).

PROFILE_VLLM_COMPATIBLE=1
PROFILE_DOCKER_IMAGE=spark-qwen35vl:v1
PROFILE_BASH_WRAPPER=1
PROFILE_DTYPE='bfloat16'
PROFILE_QUANTIZATION='fp8'
PROFILE_GPU_MEM_UTIL='0.85'
PROFILE_MAX_MODEL_LEN=131072
PROFILE_MAX_NUM_SEQS=4
PROFILE_MAX_NUM_BATCHED_TOKENS=4096
PROFILE_ENFORCE_EAGER=1
PROFILE_TRUST_REMOTE_CODE=0
PROFILE_KV_CACHE_DTYPE='fp8'
PROFILE_USE_V2_MODEL_RUNNER=0  # linear-attention / Mamba-Hybrid → kein MRV2-Pfad
PROFILE_NOTES='FP8 dense. spark-qwen35vl:v1 (NVIDIA Spark + conv3d-Patch). Native VL-Arch Qwen3_5ForConditionalGeneration. Gleicher Fix wie Qwen3.6-35B-A3B-FP8.'
