# vLLM Profil – mistralai/Mistral-Medium-3.5-128B-EAGLE
#
# ⚠️  KEIN STANDALONE-MODELL.
#
# Dies ist der EAGLE-Draft-Decoder (~3 GB consolidated.safetensors) für die
# spekulative Dekodierung des Targets `mistralai/Mistral-Medium-3.5-128B`.
# Wird NICHT mit `vllm serve <pfad>` als Hauptmodell gestartet, sondern über
# das Target-Profil via:
#   --speculative_config '{"model": "<eagle-pfad>", "method": "eagle",
#                          "num_speculative_tokens": 3, "max_model_len": 65536}'
#
# Status auf Spark:
#   Target (Mistral-Medium-3.5-128B) BF16 ≈ 256 GB → passt NICHT in 128 GB
#   unified mem. Auch FP8 (≈128 GB) lässt keinen Headroom für KV-Cache.
#   → Draft ist ohne Spark-kompatible Quantisierung des Targets nicht nutzbar.
#   Sobald eine Mistral-Medium-3.5-128B-NVFP4-Variante landet, kann dieser
#   Draft im Target-Profil als PROFILE_VLLM_EXTRA_ARGS=('--speculative_config' '...')
#   referenziert werden.
#
# Repo-Format: Mistral consolidated (params.json + tekken.json + consolidated.safetensors),
# kein HF config.json. AutoTokenizer-Pfad funktioniert nicht; EAGLE-Modul von vLLM lädt
# direkt aus dem Mistral-Format.
#
# params.json (relevant):
#   n_layers=2, dim=12288, n_heads=96, n_kv_heads=8, head_dim=128
#   vocab_size=131072 (Tekken), max_position_embeddings=262144
#   yarn-Skalierung: original_max=4096 × factor=64 → 262144
#   quantization: fp8_e4m3 (TENSOR-Skalierung) — Draft selbst ist FP8

PROFILE_VLLM_COMPATIBLE=0
PROFILE_NOTES='EAGLE-Draft (n_layers=2, dim=12288, FP8 e4m3, ~3 GB) für Mistral-Medium-3.5-128B (Target). Nicht standalone servierbar — wird via --speculative_config aus Target-Profil geladen. Target (~256 GB BF16) passt aktuell nicht auf Spark; Draft daher VLLM_COMPATIBLE=0 bis NVFP4-Target verfügbar.'
