# vLLM Profil – nvidia/Gemma-4-31B-IT-NVFP4
# NVFP4 (modelopt compressed-tensors). vllm-openai:v0.19.1 — hat Gemma4ForConditionalGeneration.
# NVIDIA Spark 26.03 unterstützt Gemma4-Arch noch nicht (zu neu).
# v0.19.1 kennt compressed-tensors; NVFP4-Kernel ggf. Fallback auf dequant.

PROFILE_VLLM_COMPATIBLE=1
PROFILE_DOCKER_IMAGE=vllm/vllm-openai:v0.19.1
PROFILE_BASH_WRAPPER=0
PROFILE_DTYPE='bfloat16'
PROFILE_QUANTIZATION='compressed-tensors'
PROFILE_GPU_MEM_UTIL='0.85'
PROFILE_MAX_MODEL_LEN=32768
PROFILE_MAX_NUM_SEQS=8
PROFILE_ENFORCE_EAGER=1
PROFILE_TRUST_REMOTE_CODE=0
PROFILE_KV_CACHE_DTYPE='fp8'
PROFILE_DOCKER_ENV='VLLM_USE_NVFP4_CT_EMULATIONS=1'
PROFILE_NOTES='NVFP4 modelopt. v0.19.1 (Gemma4ForConditionalGeneration). EMULATION-Backend weil FlashInfer CUTLASS FP4 auf sm120/sm121 crasht. Dequant zu BF16 on-the-fly.'
