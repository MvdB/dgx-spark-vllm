# vLLM Profil – ibm-granite--granite-speech-4.1-2b-plus
# Manuell anpassen wenn nötig. Wird von vllm_spark.sh geladen.
#
# STT/ASR mit Sprecher-Diarization: Transkript mit "[Speaker N]:"-Labels und
# Wort-Timestamps "[T:N]" (Centisekunden mod 1000), ohne Interpunktion/
# Großschreibung. Architektur: GraniteSpeechPlusForConditionalGeneration
# (Conformer-Encoder + Q-Former-Projektor + Granite-4.0-2B-Backbone,
# has_lora_adapter=false → kein LoRA nötig).
#
# Erfordert vLLM v0.23.0+. Validiert auf GB10 (2026-07-03), zwei API-Wege:
#   /v1/audio/transcriptions  → reines ASR (multipart file-Upload,
#                               OpenAI-Whisper-kompatibel; "prompt"-Param
#                               wird ignoriert → keine Sprecher-Labels)
#   /v1/chat/completions      → alle Modi via Prompt, Audio als base64
#                               "audio_url" im Message-Content.
#     ACHTUNG: model_type granite_speech_plus fehlt in vLLMs Placeholder-
#     Map → "<|audio|>" muss MANUELL am Anfang des Text-Contents stehen,
#     sonst 500 "Failed to apply prompt replacement".
#
# Modus-Prompts (aus HF-README, wortgleich verwenden):
#   ASR : "<|audio|> can you transcribe the speech into a written format?"
#   SAA : "<|audio|> Speaker attribution: Transcribe and denote who is
#          speaking by adding [Speaker 1]: and [Speaker 2]: tags before
#          speaker turns."
#   TS  : "<|audio|> Timestamps: Transcribe the speech. After each word,
#          add a timestamp tag showing the end time in centiseconds,
#          e.g. hello [T:45] world [T:82]"
#
# Audio-Budget: ~11,7 Audio-Token/s → bei ctx 4096 max. ~5 min pro Request
# (IBM-Angabe: bis 9 min ASR/SAA, 3,5 min Timestamps — braucht Chunking).
# Incremental decoding via prefix_text möglich (Speaker-Nummern über
# Segmente hinweg stabil halten), siehe HF-README.
#
# Docker-Image hat keine Audio-Pakete (librosa/soundfile) → werden via
# PROFILE_PRE_SERVE_CMD beim Containerstart nachinstalliert.

PROFILE_VLLM_COMPATIBLE=1
PROFILE_DOCKER_IMAGE='vllm/vllm-openai:v0.23.0'
PROFILE_DTYPE='bfloat16'

# 2B-Modell (~6 GB inkl. Encoder) + KV für 4096×4 Seqs ist winzig —
# 0.30 lässt Unified Memory für parallele Workloads frei.
PROFILE_GPU_MEM_UTIL='0.30'

# Backbone max_position_embeddings=4096 — hartes Kontextlimit.
# Lange Aufnahmen clientseitig in Segmente teilen.
PROFILE_MAX_MODEL_LEN=4096
PROFILE_MAX_NUM_SEQS=4

PROFILE_ENFORCE_EAGER=0
PROFILE_TRUST_REMOTE_CODE=0   # granite_speech ist nativ in vLLM

# Pre-Serve: vllm[audio] Extras nachziehen (Image enthält keine Audio-Pakete)
PROFILE_BASH_WRAPPER=1
PROFILE_PRE_SERVE_CMD='pip install vllm[audio]'

PROFILE_VLLM_EXTRA_ARGS=(
  '--limit-mm-per-prompt'   '{"audio": 1}'
  # Kurzer Alias für Clients (Open WebUI STT-Setting); der Mount-Pfad
  # bleibt als zweiter Name erhalten, damit bestehende Aufrufe weiterlaufen.
  '--served-model-name'     'granite-speech-4.1-2b-plus' '/hf_models/ibm-granite--granite-speech-4.1-2b-plus'
)

PROFILE_NOTES='STT + Sprecher-Diarization (Plus). Auf GB10 validiert (v0.23.0, 2026-07-03): ASR via /v1/audio/transcriptions ODER chat/completions; SAA/Timestamps NUR via chat/completions mit manuellem <|audio|>-Präfix im Text (model_type granite_speech_plus fehlt in vLLM-Placeholder-Map). ~11,7 Audio-Token/s → max ~5 min Audio bei ctx 4096, längere Aufnahmen chunken (prefix_text für stabile Speaker-Nummern).'
