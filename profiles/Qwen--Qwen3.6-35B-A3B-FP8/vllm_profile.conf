# vLLM Profil – Qwen/Qwen3.6-35B-A3B-FP8
# FP8 MoE. spark-qwen35vl:v1: NVIDIA Spark + conv3d-Patch für GB10 (sm_120).
# Native Qwen3_5MoeForConditionalGeneration-Arch — kein HF_OVERRIDES nötig.
# conv3d-Patch: enable_linear immer aktiv (PyTorch 2.9-Check entfernt) →
#   _forward_mulmat statt F.conv3d (cuDNN findet keinen Algorithmus auf GB10).

PROFILE_VLLM_COMPATIBLE=1
PROFILE_DOCKER_IMAGE='vllm/vllm-openai:v0.21.0'
PROFILE_BASH_WRAPPER=0
PROFILE_DTYPE='bfloat16'
PROFILE_QUANTIZATION='fp8'
PROFILE_GPU_MEM_UTIL='0.85'
PROFILE_MAX_MODEL_LEN=131072
PROFILE_MAX_NUM_SEQS=4
PROFILE_MAX_NUM_BATCHED_TOKENS=4096
PROFILE_ENFORCE_EAGER=1
PROFILE_TRUST_REMOTE_CODE=0
PROFILE_KV_CACHE_DTYPE='fp8'
PROFILE_NOTES='FP8 MoE. spark-qwen35vl:v1 (NVIDIA Spark + conv3d-Patch). Native VL-Arch Qwen3_5MoeForConditionalGeneration. conv3d fix: enable_linear immer aktiv → kein F.conv3d auf GB10-cuDNN.'

PROFILE_USE_V2_MODEL_RUNNER=0  # MRV2 inkompatibel: mamba_cache_mode=align
