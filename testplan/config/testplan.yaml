    system_prompt: *default_system_prompt
    notes: "2026-08-21 nachgetragen; lag seit dem 12.08. gesynct ohne Eintrag, gefunden von pruefe_modellbestand.py. Rezept recipes.vllm.ai/poolside/Laguna-S-2.1 ist ausdruecklich auf DGX Spark GB10 validiert. LagunaForCausalLM und die Parser poolside_v1 sind in vLLM 0.27.1 vorhanden, an der Modellregistrierung des Images geprueft. ACHTUNG: 93 GB Gewichte auf 128 GB Unified Memory, das ist der engste Fall in der Kohorte — Profil faehrt GPU_MEM_UTIL 0.90 und MAX_NUM_SEQS 2 — der Wert ist aus dem kuratierten Profil in southbyte-spark-profiles uebernommen und dort begruendet (der Super traegt auf derselben Maschine 0.92 bei 74,8 GiB). Eine fruehere Fassung dieser Notiz nannte 0.80; das stand in keinem Profil und war falsch. Bringt eigenen Modellcode mit (modeling_laguna.py), braucht trust_remote_code. GELAUFEN am 22.08.2026: 62 % (61/98), 18 K.O., 17,25 tok/s, TTFT 163 ms, 0 Fehlfaelle; Ladezeit 14 min. Der Reasoning-Parser poolside_v1 trennt nichts ab, weil das Modell nichts zu denken liefert: die Vorlage oeffnet <think>, das Modell schliesst sofort. Uebrig bleibt ein verwaistes </think> am Antwortanfang in 67 von 98 Faellen. Geprueft und harmlos — VOR dem Tag stehen null Zeichen, und die Bestehensquote ist mit Tag (63 %) wie ohne (61 %) gleich. Gemessen wurde die Werkseinstellung ohne Denken, wie es die Denktiefe-Politik vorsieht. Der freie Hauptspeicher lag im Lauf bei 67 bis 149 MB und oom_kill blieb bei 0 — das ist bei 0.90 der Betriebszustand, kein Notfall."

