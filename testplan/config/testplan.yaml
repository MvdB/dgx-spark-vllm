    notes: "2026-08-21 angelegt. MTPv2 ist ein separat ausgelieferter MTP-Kopf, kein eigenes Modell (1040 Tensoren, alle mit Praefix mtp, 5,9 GB). Die Modellkarte nennt genau unseren Checkpoint als unterstuetztes Ziel: NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4. NVIDIA misst die mittlere Akzeptanzlaenge mit 4,31 gegen 3,45 des im Super eingebauten MTP-Kopfs, bei Drafttiefe 7 und Temperatur 0 auf SPEED-Bench. num_speculative_tokens=3 hier nach dem GB10-Rezept (recipes.vllm.ai/nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4), nicht nach den 7 der Messung — das Rezept gilt fuer diese Maschine. ACHTUNG beim Lesen der Zahlen: der Super bringt einen EIGENEN MTP-Kopf mit, der bisher nie eingeschaltet war. Diese Zeile vergleicht also MTPv2 gegen gar keine Spekulation, nicht gegen den eingebauten Kopf. Das waere eine dritte Zeile. ZURUECKGESTELLT am 2026-08-22 nach dem Fehlversuch in der Nacht vom 21. auf den 22.08.: Start 00:12:53, ab 00:21:07 wiederholt 'NVRM: Out of memory [NV_ERR_NO_MEMORY]' aus _memdescAllocInternal im Kernel-Log, der Server wurde nie bereit. Schlimmer als der Fehlstart ist, dass der Prozess sich NICHT beendet hat: der Container lief bis 04:30 weiter, 4 h 16 min CPU-Zeit, und trieb die Maschine in den globalen OOM. Der erschlug rsyslogd, systemd-logind und die Bash der tmux-Sitzung — damit starben auch der Aufpasser und die Folgekette mit den fuenf neuen Modellen, die deshalb nie angefangen hat. Vor einem neuen Versuch sind ZWEI Dinge noetig, keines davon Beifang: (1) das KV-Budget neu rechnen, denn der Drafter mit 5,9 GB BF16 kommt auf das Budget obendrauf und das Profil ist fuer den Super OHNE Spekulation gerechnet; (2) eine harte Abbruchgrenze, damit ein haengender Start die Maschine nicht noch einmal mitnimmt."
    sampling:
      temperature: 1.0
      top_p: 0.95
    chat_template_kwargs:
      enable_thinking: true
      low_effort: true

