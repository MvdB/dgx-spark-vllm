    vllm_extra_args: '--speculative-config {"model":"/hf_models/google--gemma-4-31B-it-assistant","num_speculative_tokens":4}'
    notes: "2026-08-23 angelegt, Drafter am 23.08. um 12:00 gesynct, noch nicht gelaufen. google/gemma-4-31B-it-assistant ist der offizielle MTP-Drafter; die Modellkarte nennt genau unser Ziel (TARGET_MODEL_ID google/gemma-4-31B-it), und die Kohortenzeile faehrt genau dieses Profil. vLLM 0.27.1 unterstuetzt ihn nativ: config/speculative.py erkennt model_type gemma4_assistant und schreibt die Architektur auf Gemma4MTPModel um. Deshalb steht KEIN method-Feld im JSON — vLLM leitet die Methode selbst aus dem model_type ab, und das Rezept schreibt es auch nicht hin. num_speculative_tokens=4 stammt aus dem Rezept recipes.vllm.ai/Google/gemma-4-31B-it (gilt ab vLLM 0.19.1, wir fahren 0.27.1). ACHTUNG, hier lag eine erste Fassung dieses Eintrags falsch: aus n_predict=1 und einer Warnung in speculative.py war auf 1 geschlossen worden. Die Warnung ist generisch fuer MTP-Drafter; hier laeuft ein eigenstaendiges kleines Draftmodell, das autoregressiv viermal aufgerufen wird, um vier Token vorzuschlagen. Nicht mit den 3 von Qwen3.8-27B-NVFP4-MTP verwechseln, dort steckt der Kopf im Checkpoint. Die Parser des Rezepts (reasoning-parser gemma4, tool-call-parser gemma4, auto-tool-choice) stehen bereits im Profil der Grundlinie und sind damit in beiden Zeilen gleich. SPEICHER: 59 GB Gewichte plus 0,93 GB Drafter bei GPU_MEM_UTIL 0.88 von 128 GB — rund 112 GB Budget, also gut 50 GB fuer KV-Cache. Anders als bei Nemotron-3-Super-MTPv2, wo 5,9 GB Drafter auf ein fuer den Betrieb ohne Spekulation gerechnetes Budget kamen und die Maschine in den OOM lief."

