  - name: "Gemma-4-31B-MTP"
    profile: "google--gemma-4-31B-it"
    machine: "machine_b"
    tags: ["cohort_c", "dense", "multimodal", "spekulativ"]
    active: false   # laeuft gezielt ueber --models
    params_b: 31
