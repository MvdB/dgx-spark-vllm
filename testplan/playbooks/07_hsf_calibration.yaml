# =============================================================================
# Playbook 07: HSF-Kalibrierung
# =============================================================================
# Hardware-Skalierungsfaktor: DGX Spark → Produktionsmaschinen
#
# ACHTUNG: Dieses Playbook belastet Produktionsmaschinen!
# Nur nach Absprache aktivieren. Standardmäßig deaktiviert.
#
# Zweck: Gleiche Workloads auf DGX Spark und Produktionsmaschine ausführen,
# Skalierungsfaktoren mit Konfidenzintervall berechnen. Damit können
# alle Performance-Metriken aus Playbook 06 auf die Produktionsumgebung
# extrapoliert werden — ohne die Produktion dauerhaft zu belasten.
# =============================================================================

name: "07_hsf_calibration"
description: "Hardware-Skalierungsfaktor DGX Spark → Produktion"
version: "1.0"
timeout_minutes: 180
enabled: false                 # Manuell aktivieren!

evaluator: "performance"       # Nutzt HSFCalibrator aus performance.py

# ---------------------------------------------------------------------------
# Kalibrierungs-Konfiguration
# ---------------------------------------------------------------------------
calibration:
  # Pro Modell × Zielmaschine wird ein separater HSF berechnet
  # (Ein Modell kann auf Machine A und B unterschiedlich skalieren)

  target_machines:
    machine_a:
      host: "prod-machine-a"
      port: 8000
      description: "2× RTX 6000 Ada (48 GB, PCIe 4.0)"
      models_to_calibrate:
        - "Mistral-Small-24B"
        - "Ministral3-14B"

    machine_b:
      host: "prod-machine-b"
      port: 8000
      description: "4× H200 SXM (141 GB, NVLink 4.0)"
      models_to_calibrate:
        - "gpt-oss-120b"
        - "Qwen3.5-122B-A10B"
        - "Nemotron-3-Super"
        - "Mistral-Small-4"

  # Workload: Identisch auf beiden Maschinen
  workload:
    samples_per_prompt_type: 20
    prompt_types: ["short", "medium", "long"]
    source: "performance/"     # Nutzt gleiche Testdaten wie Playbook 06

  # Statistik
  statistics:
    method: "bootstrap"
    n_bootstrap: 1000
    confidence_level: 0.95     # 95%-Konfidenzintervall
    uncertainty_corridor: 0.25 # ±25% als zusätzlicher Sicherheitspuffer

# ---------------------------------------------------------------------------
# Ablauf
# ---------------------------------------------------------------------------
procedure:
  steps:
    - step: 1
      action: "Modell auf DGX Spark starten"
      note: "Bereits in Playbook 06 geschehen — Ergebnisse wiederverwenden"

    - step: 2
      action: "Gleiches Modell auf Zielmaschine starten"
      note: "vLLM muss auf Produktionsmaschine installiert und konfiguriert sein"
      prerequisite: "Freigabe vom Betrieb einholen"

    - step: 3
      action: "Identische Workloads auf beiden Maschinen fahren"
      note: "Sequenziell, nicht parallel — sonst verfälschen sich die Messungen"

    - step: 4
      action: "HSF berechnen"
      metrics:
        - name: "hsf_ttft"
          formula: "median(spark_ttft) / median(prod_ttft)"
          interpretation: "Faktor > 1 = Produktion schneller als Spark"
        - name: "hsf_throughput"
          formula: "median(prod_tps) / median(spark_tps)"
          interpretation: "Faktor > 1 = Produktion höherer Durchsatz"

    - step: 5
      action: "Konfidenzintervall via Bootstrap"
      note: "1000 Resampling-Runden, 95%-CI"

    - step: 6
      action: "HSF-Tabelle in Report schreiben"
      format: |
        | Modell | Maschine | HSF TTFT | CI TTFT | HSF Throughput | CI Throughput |
        |--------|----------|----------|---------|----------------|---------------|
        | ...    | ...      | ...      | ...     | ...            | ...           |

# ---------------------------------------------------------------------------
# Output
# ---------------------------------------------------------------------------
output:
  hsf_table_file: "reports/hsf_table.json"
  description: |
    HSF-Tabelle wird als JSON exportiert und kann in zukünftigen Testläufen
    referenziert werden, um Performance-Metriken auf Produktion hochzurechnen
    ohne erneut die Produktionsmaschinen zu belasten.

    Gültigkeitsdauer: Bis zur nächsten signifikanten Änderung an:
    - vLLM-Version
    - Modell-Quantisierung
    - GPU-Treiber
    - Batch-Size-Konfiguration
