[tool.setuptools]
packages = []

[project]
name = "llm-testplan"
version = "1.0.0"
description = "Automatisierter LLM-Testplan für On-Premise KI-Plattform"
requires-python = ">=3.11"
license = "MIT"

dependencies = [
    "openai>=1.40.0",          # OpenAI-kompatible API-Calls gegen vLLM
    "pyyaml>=6.0",             # Konfiguration
    "rich>=13.0",              # Terminal-Output und Progress
    "jinja2>=3.1",             # Report-Templates
    "scipy>=1.11",             # Statistische Tests (Cohen's Kappa, Chi², etc.)
    "numpy>=1.26",             # Numerik
    "pandas>=2.1",             # Datenauswertung und CSV-Export
    "aiohttp>=3.9",            # Async HTTP für Load-Tests
    "paramiko>=3.4",           # SSH für Remote-DGX-Spark-Steuerung
    "jsonschema>=4.20",        # Testdaten gegen testdata/schema.json prüfen
]

[project.optional-dependencies]
security = [
    # promptfoo wird als CLI installiert (npm), nicht als Python-Dep
]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.0",
]

[project.scripts]
testplan = "orchestrator:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
